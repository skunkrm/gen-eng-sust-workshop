# Tema "Carta": chiaro e pulito. Il tema scuro si attiva col pulsante nell'intestazione dell'app.
[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2E7D47"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F3"
textColor = "#17211C"
linkColor = "#1D6B37"
borderColor = "#D5DDD8"
baseRadius = "0.6rem"
baseFontSize = 17
showWidgetBorder = true
font = "Schibsted Grotesk:https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap, Segoe UI, sans-serif"
headingFont = "Schibsted Grotesk:https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap, Segoe UI, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, Consolas, monospace"

[theme.sidebar]
backgroundColor = "#F5F7F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17211C"
borderColor = "#D5DDD8"
